@if (shouldShow) {
  <ul class="suggestions">
    @if (searching) {
      <li class="status-row">Buscando...</li>
    } @else {
      @for (car of suggestions; track trackById($index, car)) {
        <li (click)="onChoose(car)">
          @if (showImage && car.foto) {
            <img [src]="car.foto" [alt]="car.nome" />
          }
          <span>{{ car.marca ? car.marca + ' ' : '' }}{{ car.nome }}</span>
        </li>
      }
    }
  </ul>
}
